<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Box- & Intervalltimer Pro</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="manifest" href="manifest.json">
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
</head>
<body>

    <!-- HAUPTFENSTER: Plan-Verwaltung -->
    <div id="main-view" class="view">
        <header>
            <select id="plan-selector">
                <option value="">-- Kein Plan geladen --</option>
            </select>
            <div class="header-buttons">
                <label class="btn btn-orange" for="excel-input">📥 Excel Laden</label>
                <input type="file" id="excel-input" accept=".xlsx" style="display: none;">
                <button id="btn-delete-plan" class="btn btn-red">🗑️ Löschen</button>
            </div>
        </header>

        <main>
            <div class="table-container">
                <table id="plan-table">
                    <thead>
                        <tr>
                            <th>Phase / Übung</th>
                            <th>Dauer</th>
                            <th>Pause</th>
                            <th>Bemerkung</th>
                        </tr>
                    </thead>
                    <tbody>
                        <!-- Dynamisch befüllt -->
                    </tbody>
                </table>
            </div>
        </main>

        <footer>
            <div class="time-summary">
                <div id="lbl-total-time">Gesamtdauer: 00:00</div>
                <div id="lbl-end-time">Endzeit: --:-- Uhr</div>
            </div>
            <button id="btn-start-training" class="btn btn-green btn-large">⚡ TRAINING STARTEN</button>
        </footer>
    </div>

    <!-- TRAININGS-MODUS (Vollbild-Timer) -->
    <div id="training-view" class="view hidden">
        <!-- ... (Der Inhalt des Trainings-Views bleibt unverändert) ... -->
    </div>

    <script src="app.js"></script>
</body>
</html>
