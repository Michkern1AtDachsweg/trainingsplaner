<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Trainingsplaner Pro</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <style>
        :root {
            --bg-dark: #2c3e50;
            --panel-dark: #34495e;
            --text-light: #ecf0f1;
            --green: #2ecc71;
            --red: #e74c3c;
            --orange: #f39c12;
            --blue: #3498db;
            --safe-area-bottom: env(safe-area-inset-bottom, 20px);
        }

        body, html {
            height: 100%;
            width: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: var(--bg-dark);
            color: var(--text-light);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        }

        .view {
            display: flex;
            flex-direction: column;
            height: 100%;
        }

        .hidden {
            display: none !important;
        }

        header {
            padding: 15px;
            background-color: var(--panel-dark);
            flex-shrink: 0;
        }

        select, .btn {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            font-size: 16px;
            border: 1px solid #7f8c8d;
            background-color: var(--bg-dark);
            color: var(--text-light);
        }

        .header-buttons {
            display: flex;
            gap: 10px;
            margin-top: 10px;
        }

        .btn {
            border: none;
            font-weight: bold;
            cursor: pointer;
            flex: 1;
            text-align: center;
        }

        .btn-green {
            background-color: var(--green);
        }

        .btn-red {
            background-color: var(--red);
        }

        .btn-orange {
            background-color: var(--orange);
            color: #1e272e;
        }

        .btn-blue {
            background-color: var(--blue);
        }

        #btn-start-training:disabled {
            background-color: #7f8c8d;
            cursor: not-allowed;
            opacity: 0.5;
        }

        main {
            flex-grow: 1;
            overflow-y: auto;
            background-color: var(--panel-dark);
            margin-top: 15px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th, td {
            padding: 14px;
            text-align: left;
            border-bottom: 1px solid #4a6fa5;
        }

        th {
            background-color: #34495e;
            position: sticky;
            top: 0;
            font-size: 14px;
        }

        footer {
            padding: 15px;
            padding-bottom: calc(15px + var(--safe-area-bottom));
            background-color: var(--panel-dark);
            flex-shrink: 0;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .time-summary {
            display: flex;
            justify-content: space-between;
            font-weight: bold;
        }

        #training-view {
            display: grid;
            place-content: center;
            text-align: center;
            height: 100%;
            padding: 20px;
            padding-bottom: calc(20px + var(--safe-area-bottom));
        }

        .training-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 20px;
            width: 100%;
            max-width: 500px;
        }

        #timer-step-name {
            font-size: clamp(24px, 6vw, 40px);
            font-weight: 900;
        }

        #timer-countdown {
            font-size: clamp(90px, 25vh, 150px);
            font-weight: 900;
            margin: 15px 0;
        }

        .training-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            width: 100%;
        }

        .info-card {
            background-color: rgba(0,0,0,0.2);
            padding: 15px;
            border-radius: 10px;
        }

            .info-card span {
                font-size: 12px;
                color: #bdc3c7;
            }

            .info-card strong {
                font-size: 18px;
                display: block;
                margin-top: 5px;
            }

        #timer-next-exercise {
            font-weight: bold;
            font-size: 16px;
        }

        .timer-controls {
            display: flex;
            gap: 10px;
            width: 100%;
        }
    </style>
</head>
<body>
    <div id="main-view" class="view">
        <header>
            <select id="plan-selector"><option value="">-- Kein Plan --</option></select>
            <div class="header-buttons">
                <button id="btn-load-github" class="btn btn-blue">🌐 Vorlage laden</button>
                <label class="btn btn-orange" for="excel-input">📥 Eigene Excel</label>
                <input type="file" id="excel-input" accept=".xlsx" style="display:none;">
                <button id="btn-delete-plan" class="btn btn-red">🗑️ Löschen</button>
            </div>
        </header>
        <main><table id="plan-table"><thead><tr><th>Phase</th><th>Dauer</th><th>Pause</th><th>Bemerkung</th></tr></thead><tbody></tbody></table></main>
        <footer>
            <div class="time-summary"><div id="lbl-total-time"></div><div id="lbl-end-time"></div></div>
            <button id="btn-start-training" class="btn btn-green">⚡ TRAINING STARTEN</button>
        </footer>
    </div>
    <div id="training-view" class="view hidden">
        <div class="training-container">
            <h1 id="timer-step-name"></h1><p id="timer-note"></p><div id="timer-countdown"></div>
            <div class="training-grid">
                <div class="info-card"><span>⏳ Restzeit</span><strong id="timer-total-remaining"></strong></div>
                <div class="info-card"><span>🔄 Phasen</span><strong id="timer-rounds"></strong></div>
                <div class="info-card"><span>🏁 Ende</span><strong id="timer-end-time-active"></strong></div>
            </div>
            <div id="timer-next-exercise"></div>
            <div class="timer-controls">
                <button id="btn-pause" class="btn btn-orange">⏸️ PAUSE</button>
                <button id="btn-skip" class="btn btn-blue">⏭️ SKIP</button>
                <button id="btn-stop" class="btn btn-red">⏹️ BEENDEN</button>
            </div>
        </div>
    </div>
    <script>
        let allPlans = {}; let currentPlan = null; let activeInterval = null; let boxingBell = null;
        let timerState = { stepIndex: 0, timeLeft: 0, totalRemaining: 0, isPaused: false };
        const githubExcelUrl = 'https://raw.githubusercontent.com/Michkern1AtDachsweg/trainingsplaner/main/Trainingsplan.xlsx';

        window.addEventListener('load', () => {
            initEventListeners();
            try {
                const saved = localStorage.getItem('trainingsplaene');
                if (saved) { allPlans = JSON.parse(saved); }
            } catch (e) { console.error("Fehler beim Laden:", e); localStorage.clear(); }
            updatePlanSelector();
            const firstPlanName = Object.keys(allPlans)[0];
            if (firstPlanName) {
                document.getElementById('plan-selector').value = firstPlanName;
                currentPlan = allPlans[firstPlanName];
            }
            renderPlanTable();
        });

        function initEventListeners() {
            document.getElementById('excel-input').addEventListener('change', handleLocalExcelImport);
            document.getElementById('plan-selector').addEventListener('change', (e) => { currentPlan = allPlans[e.target.value] || null; renderPlanTable(); });
            document.getElementById('btn-delete-plan').addEventListener('click', deleteCurrentPlan);
            document.getElementById('btn-start-training').addEventListener('click', startTraining);
            document.getElementById('btn-load-github').addEventListener('click', loadExcelFromGithub);
            document.getElementById('btn-pause').addEventListener('click', togglePause);
            document.getElementById('btn-skip').addEventListener('click', skipStep);
            document.getElementById('btn-stop').addEventListener('click', () => quitTraining(false));
        }

        function processExcelData(arrayBuffer) {
            const data = new Uint8Array(arrayBuffer);
            const workbook = XLSX.read(data, { type: 'array' });
            const tempPlans = {};
            workbook.SheetNames.forEach(sheetName => {
                const ws = workbook.Sheets[sheetName];
                const jsonData = XLSX.utils.sheet_to_json(ws, { header: 1 });
                const newPlan = { name: sheetName, steps: [] };
                let headerFound = false;
                for (const row of jsonData) {
                    if (!row || !row[0]) continue;
                    if (!headerFound && row[0].toString().toLowerCase().includes('zeit')) { headerFound = true; continue; }
                    if (!headerFound) continue;
                    const [baseName, workMin, repeats, pauseMin, , note] = row;
                    if (!baseName) continue;
                    const pWorkMin = parseFloat(String(workMin || 0).replace(',', '.'));
                    const pRepeats = parseInt(repeats) || 1;
                    const pPauseMin = parseFloat(String(pauseMin || 0).replace(',', '.'));
                    for (let r = 1; r <= pRepeats; r++) {
                        newPlan.steps.push({ name: `${baseName}${pRepeats > 1 ? ` (Runde ${r}/${pRepeats})` : ''}`, duration: pWorkMin * 60, isPause: false, note: note || "" });
                        if (pPauseMin > 0) newPlan.steps.push({ name: "Pause", duration: pPauseMin * 60, isPause: true, note: `Nächste Übung: ${baseName}` });
                    }
                }
                if (newPlan.steps.length > 0) tempPlans[sheetName] = newPlan;
            });
            return tempPlans;
        }

        function handleLocalExcelImport(e) {
            const file = e.target.files[0]; if (!file) return;
            const reader = new FileReader();
            reader.onload = (event) => {
                try {
                    const loadedPlans = processExcelData(event.target.result);
                    allPlans = { ...allPlans, ...loadedPlans };
                    saveToStorage(); updatePlanSelector();
                    const lastPlanName = Object.keys(loadedPlans).pop();
                    if (lastPlanName) { document.getElementById('plan-selector').value = lastPlanName; currentPlan = allPlans[lastPlanName]; }
                    renderPlanTable();
                } catch (err) { alert("Fehler beim Verarbeiten der lokalen Excel-Datei."); }
            };
            reader.readAsArrayBuffer(file);
        }

        function loadExcelFromGithub() {
            const btn = document.getElementById('btn-load-github');
            btn.textContent = "⌛"; btn.disabled = true;
            fetch(githubExcelUrl)
                .then(response => { if (!response.ok) throw new Error(`Netzwerkfehler (${response.status})`); return response.arrayBuffer(); })
                .then(arrayBuffer => {
                    const loadedPlans = processExcelData(arrayBuffer);
                    allPlans = { ...allPlans, ...loadedPlans };
                    saveToStorage(); updatePlanSelector();
                    const lastPlanName = Object.keys(loadedPlans).pop();
                    if (lastPlanName) { document.getElementById('plan-selector').value = lastPlanName; currentPlan = allPlans[lastPlanName]; }
                    renderPlanTable();
                    alert("Vorlage von GitHub erfolgreich geladen und gespeichert!");
                })
                .catch(err => alert(`Import von GitHub fehlgeschlagen: ${err.message}`))
                .finally(() => { btn.textContent = "🌐 Vorlage laden"; btn.disabled = false; });
        }

        function deleteCurrentPlan() {
            if (!currentPlan || !confirm(`Soll der Plan "${currentPlan.name}" wirklich gelöscht werden?`)) return;
            delete allPlans[currentPlan.name]; currentPlan = null; document.getElementById('plan-selector').value = "";
            saveToStorage(); updatePlanSelector(); renderPlanTable();
        }

        function updatePlanSelector() {
            const selector = document.getElementById('plan-selector');
            selector.innerHTML = '<option value="">-- Wähle einen Plan --</option>';
            Object.keys(allPlans).forEach(name => selector.add(new Option(name, name)));
            if (currentPlan) selector.value = currentPlan.name;
        }

        function renderPlanTable() {
            const tableBody = document.getElementById('plan-table').querySelector('tbody');
            const startButton = document.getElementById('btn-start-training');
            tableBody.innerHTML = "";
            if (!currentPlan || currentPlan.steps.length === 0) {
                document.getElementById('lbl-total-time').textContent = "Gesamtdauer: 00:00";
                document.getElementById('lbl-end-time').textContent = "Endzeit: --:--";
                startButton.disabled = true; return;
            }
            startButton.disabled = false;
            let totalSeconds = currentPlan.steps.reduce((acc, step) => acc + step.duration, 0);
            currentPlan.steps.forEach(step => {
                const tr = document.createElement('tr');
                tr.innerHTML = `<td>${step.name}</td><td>${formatTime(step.duration)}</td><td>${step.isPause ? '✔️' : '❌'}</td><td>${step.note || ''}</td>`;
                tableBody.appendChild(tr);
            });
            document.getElementById('lbl-total-time').textContent = `Gesamtdauer: ${formatTime(totalSeconds)}`;
            const end = new Date(Date.now() + totalSeconds * 1000);
            document.getElementById('lbl-end-time').textContent = `Endzeit: ${end.getHours().toString().padStart(2, '0')}:${end.getMinutes().toString().padStart(2, '0')}`;
        }

        function formatTime(s) { const m = Math.floor(s / 60).toString().padStart(2, '0'); const sec = Math.round(s % 60).toString().padStart(2, '0'); return `${m}:${sec}`; }
        function saveToStorage() { localStorage.setItem('trainingsplaene', JSON.stringify(allPlans)); }

        function startTraining() {
            if (!currentPlan || currentPlan.steps.length === 0) return;
            if (!boxingBell) { try { boxingBell = new Audio('boxing-bell.mp3'); boxingBell.load(); } catch (e) { } }
            document.getElementById('main-view').classList.add('hidden');
            document.getElementById('training-view').classList.remove('hidden');
            timerState = { stepIndex: 0, isPaused: false, totalRemaining: currentPlan.steps.reduce((acc, s) => acc + s.duration, 0) };
            runStep();
        }

        function runStep() {
            if (timerState.stepIndex >= currentPlan.steps.length) {
                clearInterval(activeInterval); if (boxingBell) boxingBell.play();
                alert("Training beendet!"); quitTraining(true); return;
            }
            const step = currentPlan.steps[timerState.stepIndex];
            timerState.timeLeft = step.duration;
            document.getElementById('timer-step-name').textContent = step.name.toUpperCase();
            document.getElementById('timer-note').textContent = step.note || "";
            document.getElementById('training-view').style.backgroundColor = step.isPause ? "#2980b9" : "#c0392b";
            updateNextExercise(); updateTimerDisplay();
            if (boxingBell) boxingBell.play();
            clearInterval(activeInterval); activeInterval = setInterval(timerTick, 1000);
        }

        function timerTick() {
            if (timerState.isPaused) return;
            if (timerState.timeLeft <= 1) {
                timerState.stepIndex++; runStep();
            } else {
                timerState.timeLeft--; timerState.totalRemaining--; updateTimerDisplay();
            }
        }

        function updateTimerDisplay() {
            document.getElementById('timer-countdown').textContent = formatTime(timerState.timeLeft);
            document.getElementById('timer-total-remaining').textContent = formatTime(timerState.totalRemaining);
            document.getElementById('timer-rounds').textContent = `${timerState.stepIndex + 1}/${currentPlan.steps.length}`;
            const end = new Date(Date.now() + timerState.totalRemaining * 1000);
            document.getElementById('timer-end-time-active').textContent = `${end.getHours().toString().padStart(2, '0')}:${end.getMinutes().toString().padStart(2, '0')}`;
        }

        function updateNextExercise() {
            const next = currentPlan.steps.slice(timerState.stepIndex + 1).find(s => !s.isPause);
            document.getElementById('timer-next-exercise').textContent = next ? `NÄCHSTE ÜBUNG: ${next.name}` : "LETZTE RUNDE! GIB ALLES!";
        }

        function togglePause() {
            timerState.isPaused = !timerState.isPaused;
            document.getElementById('btn-pause').textContent = timerState.isPaused ? "▶️ FORTSETZEN" : "⏸️ PAUSE";
            document.getElementById('training-view').style.backgroundColor = timerState.isPaused ? "#7f8c8d" : (currentPlan.steps[timerState.stepIndex].isPause ? "#2980b9" : "#c0392b");
        }

        function skipStep() { timerState.totalRemaining -= timerState.timeLeft; timerState.stepIndex++; runStep(); }
        function quitTraining(force = false) {
            if (force || confirm("Training abbrechen?")) {
                clearInterval(activeInterval);
                document.getElementById('training-view').classList.add('hidden');
                document.getElementById('main-view').classList.remove('hidden');
            }
        }
    </script>
</body>
</html>
